[package]
name = "intel-siam"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "intel_siam"
path = "src/lib.rs"

[[bin]]
name = "intel-siam"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytemuck = "1"
eframe = { version = "0.37", features = ["persistence"] }
egui = { version = "0.37", features = ["bytemuck"] }
getrandom = "0.3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
