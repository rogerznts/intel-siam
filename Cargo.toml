[package]
name = "intel-siam"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "intel-siam"

[lib]
name = "intel_siam"
path = "src/lib.rs"

[[bin]]
name = "intel-siam"
path = "src/main.rs"

[[bin]]
name = "intel-siam-vision"
path = "src/bin/intel-siam-vision.rs"

[dependencies]
base64 = "0.22"
bytemuck = "1"
eframe = { version = "0.37", features = ["persistence"] }
egui = { version = "0.37", features = ["bytemuck"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
open = "5"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
percent-encoding = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
